name: Actualizar precios gasolineras
on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gas.py
      - run: |
          git config user.name "kalea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gas.json
          git diff --cached --quiet || (git commit -m "Precios de gasolineras actualizados" && git push)
