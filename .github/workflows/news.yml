name: Actualizar noticias y empleo
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/news.py
      - run: |
          git config user.name "kalea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          [ -f lanbide.json ] && git add lanbide.json || true
          git diff --cached --quiet || (git commit -m "Noticias actualizadas" && git push)
